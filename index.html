<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Diego Silva — Desenvolvedor Full-Stack</title>
    <meta
      name="description"
      content="Portfólio de Diego Silva, desenvolvedor full-stack. Projetos em React, Next.js, Node.js, TypeScript e PostgreSQL."
    />
    <meta name="theme-color" content="#06080c" />
    <meta name="color-scheme" content="dark" />

    <!-- Open Graph (pré-visualização ao compartilhar o link) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Diego Silva — Desenvolvedor Full-Stack" />
    <meta property="og:description" content="Projetos, stack e contato de Diego Silva." />
    <meta property="og:image" content="./assets/hero-banner.webp" />

    <link rel="icon" type="image/jpeg" href="./assets/logo.jpg" />

    <!-- Pré-carrega os assets do topo para o primeiro paint -->
    <link rel="preload" as="image" href="./assets/portrait.webp" type="image/webp" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300..800&family=Inter:wght@300..700&family=JetBrains+Mono:wght@400..600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Ativa a abertura cinematográfica (desligada para quem prefere menos movimento) -->
    <script>
      try {
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.documentElement.classList.add('has-intro');
          document.documentElement.style.setProperty('--intro', '1.75s');
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <noscript>Este site precisa de JavaScript habilitado.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
